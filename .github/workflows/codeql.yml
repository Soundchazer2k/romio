# GitHub's static analysis: free on public repos, results under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # actions = the workflow files themselves (e.g. unpinned or injectable steps)
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4
        with:
          category: /language:${{ matrix.language }}
